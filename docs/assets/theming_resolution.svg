<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="460" height="150" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="460" height="150" fill="#fff"/>
  <text x="345" y="12" text-anchor="middle" font-size="11" fill="#555">viewer's color-scheme</text>

  <rect x="10" y="55" width="200" height="40" rx="6" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-size="13" fill="#222" font-family="Menlo,Consolas,monospace">light-dark(#fff, #1a1a1a)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#888"/>
    </marker>
  </defs>

  <path d="M210 68 C 260 68, 260 38, 298 38" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="48" font-size="11" fill="#555">light</text>
  <rect x="305" y="25" width="26" height="26" rx="4" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="42" font-size="12" fill="#222">viewer sees #fff</text>

  <path d="M210 82 C 260 82, 260 112, 298 112" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="235" y="105" font-size="11" fill="#555">dark</text>
  <rect x="305" y="99" width="26" height="26" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1.5"/>
  <text x="340" y="116" font-size="12" fill="#222">viewer sees #1a1a1a</text>
</svg>
