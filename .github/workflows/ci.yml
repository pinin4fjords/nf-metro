name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
      - run: mypy

  skill-selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The checker validates the fix-issue skill's internal consistency: link
      # resolution, agent-definition/tier-table agreement, shell parsing in both
      # shells, script self-tests and the post-compaction token budget. Without
      # this job a future edit can break any of them while the rest of CI is green.
      - run: pip install -e ".[skill-checks]"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - run: python .claude/skills/fix-issue/scripts/check_skill.py
        env:
          # With a key the token budget is measured exactly via count_tokens.
          # Without one the checker falls back to a scaled tiktoken proxy, which
          # is conservative rather than wrong, so this secret is optional.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Runs the prettier hook from prek.toml (web/docs files; Python is handled
      # by ruff in the lint job). prek auto-provisions node + prettier + the astro
      # plugin; --show-diff-on-failure (added by the action) prints what needs
      # formatting.
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: prettier --all-files

  test:
    needs: [lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        split: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,font]"
      - run: >-
          pytest --splits 3 --group ${{ matrix.split }}
          --splitting-algorithm least_duration --durations=25
          --ignore=tests/test_routing_gate_coverage.py

  routing-gates:
    name: Routing gate coverage (Python 3.11)
    needs: [lint, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,font]"
      - run: pytest -n 0 tests/test_routing_gate_coverage.py
